name: Bug report
description: Report a reproducible problem in Mellow PDF Reader
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please do not share private PDFs, personal files, or security exploit details in a public issue."
  - type: input
    id: version
    attributes:
      label: Mellow version or commit
      placeholder: "e.g. 1.0.0 or source commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and environment
      placeholder: "e.g. Windows 11 x64; scaling 150%; source or packaged app"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include sample file characteristics, if relevant, without revealing sensitive content.
      placeholder: "1. Open a PDF…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional non-sensitive context
      description: Optional logs, screenshots, regression information, or accessible sample files.
    validations:
      required: false
