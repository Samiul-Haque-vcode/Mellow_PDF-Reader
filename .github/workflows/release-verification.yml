name: Published release verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify release 1.0.0]')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          check-latest: true
      - run: python -m pip install 'pytest>=8,<10'
      - name: Check release scripts under legacy system encodings
        run: python -m pytest -q tests/test_release_assets.py
      - name: Verify published hashes, sources and Windows evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python packaging/verify_published.py
