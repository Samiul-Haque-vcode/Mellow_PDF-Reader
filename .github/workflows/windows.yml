name: Windows build
on:
  push:
    branches: [main]
    paths: ['mellow/__init__.py']
  workflow_dispatch:
    inputs:
      publish_source_release:
        description: Publish the 1.0.0 source release after successful Windows checks
        type: boolean
        default: false
      upload_artifacts:
        description: Upload short-lived build artifacts (uses Actions storage)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release 1.0.0]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Check Windows caption layout
        run: python packaging/caption_smoke.py
      - name: Check native reading aids
        run: python packaging/reading_aids_smoke.py
      - name: Check compact reader controls
        run: python -m pytest -q tests/test_compact_reader_controls.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m PyInstaller --noconfirm --clean --noupx --windowed --onedir --version-file packaging/version_info.txt --name MellowPDFReader --icon mellow/assets/mellow.ico --add-data "mellow/assets:mellow/assets" --collect-all PySide6.QtPdf --collect-all PySide6.QtPdfWidgets run_mellow.py
      - run: python packaging/collect_notices.py dist/MellowPDFReader
      - run: python packaging/smoke_test.py dist/MellowPDFReader/MellowPDFReader.exe
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/mellow.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Record hashes, signatures and Defender scan
        run: python packaging/verify_windows.py
      - name: Smoke test installed application
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "MellowInstalled"
          $choicePath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\.pdf\UserChoice'
          $beforeDefault = (Get-ItemProperty -LiteralPath $choicePath -ErrorAction SilentlyContinue).ProgId
          $installer = Start-Process -FilePath "dist/MellowPDFReader-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed" }
          $classes = 'Registry::HKEY_LOCAL_MACHINE\Software\Classes'
          $program = "$classes\MellowPDFReader.PDF"
          $openWith = "$classes\.pdf\OpenWithProgids"
          $command = (Get-Item -LiteralPath "$program\shell\open\command").GetValue('')
          $expected = '"' + (Join-Path $target 'MellowPDFReader.exe') + '" "%1"'
          if ($command -ne $expected) { throw "PDF file-opening command is not correctly quoted" }
          if ('MellowPDFReader.PDF' -notin (Get-Item -LiteralPath $openWith).GetValueNames()) { throw "Missing Open with registration" }
          $application = (Get-Item -LiteralPath "$classes\Applications\MellowPDFReader.exe\shell\open\command").GetValue('')
          if ($application -ne $expected) { throw "Missing application registration" }
          $afterDefault = (Get-ItemProperty -LiteralPath $choicePath -ErrorAction SilentlyContinue).ProgId
          if ($afterDefault -ne $beforeDefault) { throw "Installer changed the user's default PDF application" }
          Write-Host "PDF Open with registration and quoted file command verified; default app unchanged."
          python packaging/smoke_test.py "$target/MellowPDFReader.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installed application failed" }
          $uninstaller = Start-Process -FilePath "$target/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "Uninstall failed" }
          if (Test-Path "$target/MellowPDFReader.exe") { throw "Uninstall left the executable behind" }
          if (Test-Path -LiteralPath $program) { throw "Uninstall left the PDF program registration behind" }
          $remaining = Get-Item -LiteralPath $openWith -ErrorAction SilentlyContinue
          if ($remaining -and 'MellowPDFReader.PDF' -in $remaining.GetValueNames()) { throw "Uninstall left the Open with entry behind" }
          Write-Host "PDF Open with registration removed after uninstall."
      - name: Verify uninstall removes personal data and updates preserve it
        shell: pwsh
        run: ./packaging/check_uninstall.ps1
      - name: Make portable folder
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/MellowPDFReader dist/MellowPDFReader-Portable
          Set-Content dist/MellowPDFReader-Portable/portable.ini "Mellow PDF Reader portable metadata marker"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        with:
          name: MellowPDFReader-Windows-x64
          retention-days: 3
          path: |
            dist/MellowPDFReader/
            dist/MellowPDFReader-Setup.exe
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        with:
          name: MellowPDFReader-Portable-x64
          retention-days: 3
          path: dist/MellowPDFReader-Portable/
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        continue-on-error: true
        with:
          name: Windows-build-verification
          retention-days: 1
          path: dist/build-verification/
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        continue-on-error: true
        with:
          name: Windows-test-results
          retention-days: 1
          path: test-results.xml
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        continue-on-error: true
        with:
          name: Windows-caption-verification
          retention-days: 1
          path: dist/caption-verification/

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_source_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release identity
        run: |
          python -c "from mellow import __version__; assert __version__ == '1.0.0'"
      - name: Publish source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create v1.0.0
          --target "$GITHUB_SHA"
          --title "Mellow PDF Reader 1.0.0"
          --notes-file docs/releases/1.0.0.md
